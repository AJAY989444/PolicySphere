# docker-compose.yml
# Full Cloud-Native Multi-Container Orchestration (SRS Module 25 & 30)

version: '3.8'

services:
  # ─── 1. Core API & WebSocket Backend ───────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: policysphere-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://policysphere_user:policysphere_pass@postgres:5432/policyspheredb?schema=public
      - JWT_SECRET=production_enterprise_super_secret_jwt_key_2026_x9910
      - JWT_REFRESH_SECRET=production_enterprise_super_secret_refresh_key_2026_x9911
      - CORS_ORIGIN=http://localhost,http://localhost:80,http://localhost:5173
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - policysphere-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── 2. Frontend React / Vite Web Client ───────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: policysphere-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - policysphere-net

  # ─── 3. PostgreSQL Database ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: policysphere-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=policysphere_user
      - POSTGRES_PASSWORD=policysphere_pass
      - POSTGRES_DB=policyspheredb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - policysphere-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policysphere_user -d policyspheredb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 4. Redis In-Memory Cache & Rate Limiting ──────────────
  redis:
    image: redis:7-alpine
    container_name: policysphere-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - policysphere-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ─── 5. Prometheus Observability & APM ─────────────────────
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: policysphere-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - policysphere-net

  # ─── 6. Grafana Telemetry Dashboard ────────────────────────
  grafana:
    image: grafana/grafana:10.3.3
    container_name: policysphere-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=policysphere_admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - policysphere-net

networks:
  policysphere-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
