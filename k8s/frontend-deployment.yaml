apiVersion: apps/v1
kind: Deployment
metadata:
  name: policysphere-frontend
  namespace: policysphere
  labels:
    app: policysphere-frontend
    tier: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: policysphere-frontend
  template:
    metadata:
      labels:
        app: policysphere-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/ajay989444/policysphere-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: policysphere-frontend
  namespace: policysphere
  labels:
    app: policysphere-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: policysphere-frontend
